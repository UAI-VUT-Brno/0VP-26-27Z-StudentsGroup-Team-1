name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UAI.ZeroVP.sln

      - name: Build
        run: dotnet build UAI.ZeroVP.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test UAI.ZeroVP.sln --configuration Release --no-build

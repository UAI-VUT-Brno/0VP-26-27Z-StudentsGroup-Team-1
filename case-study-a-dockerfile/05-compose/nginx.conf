# Nginx as a load balancer in front of the API replicas.

events { }

http {
    # Docker's embedded DNS server. Every Compose service name resolves to the
    # addresses of ALL its replicas.
    #   valid=5s  = how long nginx may cache the answer
    #   ipv6=off  = our network is IPv4 only
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            # The target sits in a variable on purpose. Written inline, nginx
            # would resolve the name once at startup and stick to it forever.
            # With a variable the lookup repeats and new replicas join by themselves.
            set $target "api:8080";
            proxy_pass http://$target;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

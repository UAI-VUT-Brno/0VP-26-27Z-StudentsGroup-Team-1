# ============================================================================
#  Case study C, example 5 - configuration in Docker Compose
#
#  One image, two environments, no secrets inside the image.
#
#  Development:  docker compose --profile dev  up -d --build
#  Production:   docker compose --profile prod up -d --build
# ============================================================================

name: zerovp-c05

# A YAML anchor: the shared base both services inherit.
# A key starting with "x-" is an extension that Compose itself ignores.
x-api-base: &api-base
  build:
    context: ../..
    dockerfile: case-study-c-configuration/01-baseline/Dockerfile
  image: zerovp:c05
  restart: unless-stopped

services:

  # --------------------------------------------------------------------------
  #  Development shape - Swagger on, verbose logging, port exposed
  # --------------------------------------------------------------------------
  api-dev:
    <<: *api-base

    # A service with a profile starts only when that profile is requested.
    profiles: [dev]

    ports:
      # Loopback only - the development shape has no business on the network.
      - "127.0.0.1:8080:8080"

    # env_file entries are read in the order given; later ones override earlier.
    env_file:
      - common.env
      - development.env

    # environment takes precedence over env_file. Useful for values you want
    # visible directly in compose.yaml.
    environment:
      Todo__SeedSampleData: "true"

  # --------------------------------------------------------------------------
  #  Production shape - Swagger off, limited resources, hardened runtime
  # --------------------------------------------------------------------------
  api-prod:
    <<: *api-base

    profiles: [prod]

    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - common.env
      - production.env

    environment:
      Todo__SeedSampleData: "false"
      # Path to the secret file. Only the PATH travels through the configuration;
      # the password itself stays in the file under /run/secrets.
      # This sample application does not read the key - the README shows the few
      # lines of C# that would. What is on display here is the shape, not a feature.
      PasswordFilePath: /run/secrets/database-password

    secrets:
      - database-password

    # Hardening, as in example 4.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5

# A secret arrives in the container as a file at /run/secrets/<name>.
# Unlike an environment variable it shows up in neither "docker inspect" nor "env".
secrets:
  database-password:
    file: ./database-password.txt
